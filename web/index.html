<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7ec4ea" />
    <title>Mercanada</title>
    <meta name="description" content="TikTok'ta takip eden herkesin evi, mesleği ve günü olan, takipçi geldikçe büyüyen bir ada." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mercanada · takip eden herkes bu adada yaşıyor" />
    <meta property="og:description" content="TikTok'ta takip et; adada evin, mesleğin ve kendi günün olsun." />
    <meta property="og:image" content="https://mercanada.rumpuskit.com/og.jpg" />
    <meta property="og:url" content="https://mercanada.rumpuskit.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      // Yükleme ekranı adanın o anki saatiyle açılır (Türkiye saati, UTC+3): şafak, gündüz, akşam, gece.
      (function () {
        var h = (new Date().getUTCHours() + 3) % 24;
        document.documentElement.dataset.vakit = h < 6 || h >= 20 ? "gece" : h < 8 ? "safak" : h < 17 ? "gun" : "aksam";
      })();
      if (location.protocol === "http:" && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        location.replace("https:" + location.href.slice(5));
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="speed" role="group" aria-label="Zaman hızı (geliştirme)" hidden>
      <button data-speed="1" class="on">1×</button>
      <button data-speed="60">60×</button>
      <button data-speed="600">600×</button>
    </div>

    <div id="floorbar" hidden>
      <button id="floor-down" aria-label="Alt kat"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <span id="floor-label">1. kat</span>
      <button id="floor-up" aria-label="Üst kat"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
      <button id="floor-exit">Dışarı çık</button>
    </div>

    <!-- Sol sütun: üst bilgi ve altında açılan kart aynı akışta (üst üste binmezler). -->
    <div id="sol">
      <header id="hud">
        <div class="hud-top">
          <div class="brand"><img src="/favicon.svg" alt="" width="22" height="22" />Mercanada</div>
          <div class="clock" id="clock">--:--</div>
        </div>
        <div class="stats" id="stats"></div>
        <div class="online" id="online" hidden><span class="dot"></span><span id="online-n">1</span> kişi şu an adada</div>
        <button class="goal" id="next" hidden>
          <span class="goal-head"><span class="goal-label"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V3.5"/><path d="M3 21h7"/><path d="M6 4h14.5"/><path d="M6 8.5 10.5 4"/><path d="M17.5 4v5"/><rect x="16" y="9" width="3" height="2.5" rx=".5"/></svg>Sıradaki</span><span class="goal-need" id="next-need"></span></span>
          <span class="goal-name" id="next-name"></span>
          <span class="bar"><i id="next-bar"></i></span>
        </button>
        <button class="waiting" id="waiting" hidden></button>
        <button class="waiting secim" id="secim" hidden></button>
        <div class="links"><a id="cta" class="cta" target="_blank" rel="noopener">TikTok'ta takip et, adaya taşın</a><a class="priv" href="/gizlilik.html">Gizlilik</a></div>
      </header>
      <section id="card" hidden>
        <div class="grip" aria-hidden="true"></div>
        <button id="card-close" aria-label="Kapat"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <div class="card-head">
          <div class="avatar" id="card-icon" aria-hidden="true"></div>
          <div class="card-names">
            <div class="handle" id="card-handle"></div>
            <div class="title" id="card-title"></div>
          </div>
        </div>
        <div class="dream" id="card-dream" hidden></div>
        <div class="now" id="card-now"></div>
        <div id="card-tabs" role="tablist">
          <button data-tab="simdi" class="on">Şimdi</button>
          <button data-tab="bugun">Bugün</button>
          <button data-tab="hikaye">Hikâye</button>
        </div>
        <div id="card-traits"></div>
        <dl id="card-facts"></dl>
        <div id="card-actions"></div>
      </section>
    </div>

    <div id="navbtns">
      <button id="sound" aria-label="Ortam sesleri"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
      <button id="compass" aria-label="Kuzeye çevir"><span id="compass-needle"><svg class="i pusula" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 16 12H8z" fill="#e0607a" stroke="none"/><path d="M12 21.5 8 12h8z" fill="currentColor" stroke="none" opacity=".4"/></svg></span></button>
      <button id="zoom-in" aria-label="Yakınlaştır">+</button>
      <button id="zoom-out" aria-label="Uzaklaştır">−</button>
    </div>

    <div id="minimap">
      <button id="minimap-toggle" aria-label="Harita"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5 9 4.5l6 2 5.5-2v13l-5.5 2-6-2-5.5 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg></button>
      <canvas id="minimap-canvas"></canvas>
    </div>

    <div id="arama">
      <div id="yerler" hidden>
        <div class="yerler-head">Yerler</div>
        <div class="yerler-grid" id="yerler-grid"></div>
      </div>
      <ul id="oneriler" role="listbox" hidden></ul>
      <form id="search" autocomplete="off">
        <button type="button" id="yerler-btn" aria-expanded="false" aria-controls="yerler"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg><span class="lbl">Yerler</span></button>
        <input id="search-input" type="search" inputmode="search" enterkeyhint="search" spellcheck="false" placeholder="@kullanıcıadı ya da yer ara" aria-label="Kullanıcı adı ya da yer" aria-controls="oneriler" />
        <button type="submit" class="go">Bul</button>
      </form>
    </div>
