<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7ec4ea" />
    <title>Mercanada</title>
    <meta name="description" content="TikTok'ta takip eden herkesin evi, mesleği ve günü olan, takipçi geldikçe büyüyen bir ada." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mercanada · takip eden herkes bu adada yaşıyor" />
    <meta property="og:description" content="TikTok'ta takip et; adada evin, mesleğin ve kendi günün olsun." />
    <meta property="og:image" content="https://mercanada.rumpuskit.com/og.jpg" />
    <meta property="og:url" content="https://mercanada.rumpuskit.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <script>
      if (location.protocol === "http:" && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        location.replace("https:" + location.href.slice(5));
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <header id="hud">
      <div class="brand">Mercanada</div>
      <div class="line" id="clock">--:--</div>
      <div class="line muted" id="stats"></div>
      <div class="line online" id="online" hidden><span class="dot"></span><span id="online-n">1</span> kişi şu an adada</div>
      <button class="line waiting" id="waiting" hidden></button>
      <button class="line waiting next" id="next" hidden></button>
      <div class="line links"><a id="cta" target="_blank" rel="noopener">TikTok'ta takip et, adaya taşın</a><span class="sep"> · </span><a href="/gizlilik.html">Gizlilik</a></div>
    </header>

    <div id="speed" role="group" aria-label="Zaman hızı (geliştirme)" hidden>
      <button data-speed="1" class="on">1×</button>
      <button data-speed="60">60×</button>
      <button data-speed="600">600×</button>
    </div>

    <div id="floorbar" hidden>
      <button id="floor-down" aria-label="Alt kat">▼</button>
      <span id="floor-label">1. kat</span>
      <button id="floor-up" aria-label="Üst kat">▲</button>
      <button id="floor-exit">Dışarı çık</button>
    </div>

    <section id="card" hidden>
      <button id="card-close" aria-label="Kapat">×</button>
      <div class="handle" id="card-handle"></div>
      <div class="title" id="card-title"></div>
      <div class="dream" id="card-dream" hidden></div>
      <div class="now" id="card-now"></div>
      <div id="card-tabs" role="tablist">
        <button data-tab="simdi" class="on">Şimdi</button>
        <button data-tab="bugun">Bugün</button>
        <button data-tab="hikaye">Hikâye</button>
      </div>
      <div id="card-traits"></div>
      <dl id="card-facts"></dl>
      <div id="card-actions"></div>
    </section>


    <div id="navbtns">
      <button id="sound" aria-label="Ortam sesleri">🔇</button>
      <button id="compass" aria-label="Kuzeye çevir"><span id="compass-needle">▲</span></button>
      <button id="zoom-in" aria-label="Yakınlaştır">+</button>
      <button id="zoom-out" aria-label="Uzaklaştır">−</button>
    </div>

    <div id="minimap">
      <button id="minimap-toggle" aria-label="Harita">🗺</button>
      <canvas id="minimap-canvas"></canvas>
    </div>

    <nav id="places" aria-label="Yerler"></nav>

    <form id="search" autocomplete="off">
      <input id="search-input" type="search" inputmode="search" enterkeyhint="search" spellcheck="false" placeholder="@kullanıcıadı ile kendini bul" aria-label="Kullanıcı adı" />
      <button type="submit">Bul</button>
    </form>

    <div id="loading">Ada hazırlanıyor…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
