# main'e her push'ta: parite testleri, web dışa aktarımı ve GitHub Pages'a yayın (ada.rumpuskit.com).
name: Yayın

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot ve web şablonu (önbellekli)
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads

      - name: Godot indir
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -sSL -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip -d ~/godot && mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          # Şablon paketi 1.3 GB; sadece web_nothreads_release'i saklıyoruz.
          curl -sSL -o tpl.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q -j tpl.tpz templates/web_nothreads_release.zip templates/version.txt \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm godot.zip tpl.tpz

      - name: Godot'yu PATH'e ekle
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: İçe aktar
        run: godot --headless --path game --import

      - name: Parite testleri
        run: cd server && python3 -m unittest -v

      - name: Web dışa aktarımı
        run: |
          mkdir -p game/export/web
          godot --headless --path game --export-release "Web" export/web/index.html
          test -s game/export/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/export/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
